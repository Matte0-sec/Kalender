<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Schulkalender</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="controls">
      <button id="prevMonth" aria-label="Vorheriger Monat">‹</button>
      <div id="currentMonth" class="current-month"></div>
      <button id="nextMonth" aria-label="Nächster Monat">›</button>
      <button id="darkModeBtn" aria-label="Dark mode">🌙</button>
      <button id="profileBtn" type="button" aria-label="Benutzer wechseln"></button>
    </div>
    <div id="currentDate" class="current-date"></div>
  </header>

  <!-- Sidebar toggle and panel -->
  <div id="sidebar" class="sidebar">
    <button id="sidebarToggle" class="sidebar-toggle" aria-expanded="false">Aufgaben</button>
    <div id="todoPanel" class="todo-panel hidden" aria-hidden="true">
      <h3>Offene Aufgaben</h3>
      <label for="todoFilter">Filter:</label>
      <select id="todoFilter">
        <option value="offen">Offen</option>
        <option value="erledigt">Erledigt</option>
        <option value="alle">Alle</option>
      </select>
      <ul id="todoList" class="todo-list"></ul>
    </div>
  </div>

  <main>
    <div id="calendar" class="calendar"></div>
    <div class="legend">
      <span class="event hausaufgabe">Hausaufgabe</span>
      <span class="event test">Test</span>
      <span class="event ferien">Ferien</span>
      <span class="event freizeit">Freizeit</span>
      <span class="event sport">Sport</span>
      <span class="event termin">Termin</span>
      <span class="event andere">Andere</span>
    </div>
  </main>

  <!-- Modal for event create/edit -->
  <div id="modal" class="modal hidden">
    <form id="eventForm" class="modal-content">
      <h2 id="modalTitle">Ereignis</h2>
      <label>Startdatum: <input type="date" id="eventDate" required></label>
      <label>Enddatum (optional): <input type="date" id="eventEndDate"></label>
      <label>Typ:
        <select id="eventType">
          <option value="hausaufgabe">Hausaufgabe</option>
          <option value="test">Test</option>
          <option value="ferien">Ferien</option>
          <option value="freizeit">Freizeit</option>
          <option value="sport">Sport</option>
          <option value="termin">Termin</option>
          <option value="andere">Andere</option>
        </select>
      </label>
      <label><input type="checkbox" id="eventRecurring"> Wiederholen</label>
      <div id="recurrenceOptions" style="display:none;">
        <label>Wiederholung:
          <select id="eventRecurrenceType">
            <option value="weekly">Wöchentlich</option>
          </select>
        </label>
        <label>Wochentage:
          <div>
            <label><input type="checkbox" value="0" class="weekday"> So</label>
            <label><input type="checkbox" value="1" class="weekday"> Mo</label>
            <label><input type="checkbox" value="2" class="weekday"> Di</label>
            <label><input type="checkbox" value="3" class="weekday"> Mi</label>
            <label><input type="checkbox" value="4" class="weekday"> Do</label>
            <label><input type="checkbox" value="5" class="weekday"> Fr</label>
            <label><input type="checkbox" value="6" class="weekday"> Sa</label>
          </div>
        </label>
        <label>Wiederholen bis: <input type="date" id="eventRecurrenceEnd"></label>
      </div>
      <label>Titel: <input type="text" id="eventTitle" required></label>
      <label>Beschreibung: <textarea id="eventDesc"></textarea></label>
      <div class="modal-actions">
        <button type="submit" id="saveBtn">Speichern</button>
        <button type="button" id="deleteBtn" class="danger hidden">Löschen</button>
        <button type="button" id="cancelBtn">Abbrechen</button>
      </div>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
